[project]
name = "agentlab"
version = "0.1.0"
description = "Agentic coding-assistant CLI backed by a pluggable OpenRouter/Anthropic provider layer"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = [
  "typer>=0.15",
  "rich>=13.9",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "openai>=1.60",
  "anthropic>=0.45",
  "aiosqlite>=0.20",
]

[project.scripts]
agentlab = "agentlab.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "pyright>=1.1.390",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RUF", # ruff-specific
  "ASYNC", # flake8-async
]
ignore = ["E501"] # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["agentlab"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["-m", "not live", "-ra"]
asyncio_mode = "auto"
markers = [
  "live: requires real provider credentials and network access (run via `mise run test-live`)",
]
testpaths = ["tests"]
