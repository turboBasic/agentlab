[tools]
python = "3.14"
uv = "latest"
"1password-cli" = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install dependencies and pre-commit hooks"
run = [
  "uv sync --locked",
  "uv run pre-commit install",
]

[tasks.fmt]
description = "Format code with ruff"
run = "uv run ruff format ."

[tasks.lint]
description = "Lint code with ruff"
run = "uv run ruff check ."

[tasks.typecheck]
description = "Type-check with pyright"
run = "uv run pyright"

[tasks.test]
description = "Run the test suite (excludes live-API tests)"
run = "uv run pytest"

[tasks.test-live]
description = "Run opt-in live-API integration tests (requires real credentials)"
run = "op run --env-file=.env.template -- uv run pytest -m live"

[tasks.run]
description = "Run the agentlab CLI with secrets injected from 1Password"
run = "op run --env-file=.env.template -- uv run agentlab"

[tasks.ci]
description = "Run everything CI runs, locally"
depends = ["lint", "typecheck", "test"]
